<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #0a8bdc, #0fb2e6);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-card {
        width: 320px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        color: white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .login-card h2 {
        margin-bottom: 20px;
        font-size: 22px;
    }

    .input-box {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border-radius: 20px;
        border: none;
        outline: none;
    }

    .options {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 15px;
    }

    .options a {
        color: #fff;
        text-decoration: none;
    }

    .btn {
        width: 100%;
        padding: 10px;
        background: white;
        border: none;
        border-radius: 20px;
        font-size: 15px;
        cursor: pointer;
        color: #007acc;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="login-card">
    <h2>Sign in</h2>

    <input type="text" class="input-box" placeholder="Username">

    <input type="password" class="input-box" placeholder="Password">

    <div class="options">
        <label>
            <input type="checkbox"> Remember me
        </label>
        <a href="#">Forgot Password?</a>
    </div>

    <button class="btn">Sign in</button>
</div>

</body>
</html>
