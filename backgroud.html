<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-image: url("https://www.pexels.com/search/park%20background/");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        .overlay {
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(96, 40, 76);
            font-size: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 8px black;
        }
    </style>
</head>
<body>
    <div class="overlay">
        Beautiful Nature
    </div>
</body>
</html>
