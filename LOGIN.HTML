<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #6db7ff, #4a9efc);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 900px;
        height: 450px;
        background: linear-gradient(135deg, #003b7a, #0073e6);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        width: 350px;
        padding: 30px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        color: #fff;
        text-align: center;
    }

    .login-box h2 {
        margin: 10px 0;
        font-size: 28px;
    }

    .login-box label {
        display: block;
        text-align: left;
        margin-top: 15px;
        font-size: 14px;
    }

    .login-box input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border-radius: 6px;
        border: none;
        outline: none;
    }

    .forgot {
        text-align: right;
        font-size: 12px;
        margin-top: 8px;
    }

    .forgot a {
        color: #d9ecff;
        text-decoration: none;
    }

    .btn {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #002f5f;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }

    .or {
        margin: 15px 0;
        font-size: 14px;
    }

    .social {
        display: flex;
        justify-content: space-around;
    }

    .social button {
        width: 70px;
        padding: 8px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    .register {
        margin-top: 15px;
        font-size: 13px;
    }

    .register a {
        color: #ffffff;
        font-weight: bold;
        text-decoration: none;
    }
</style>
</head>

<body>

<div class="container">
    <div class="login-box">
        <small>Your logo</small>
        <h2>Login</h2>

        <label>Email</label>
        <input type="email" placeholder="username@gmail.com">

        <label>Password</label>
        <input type="password" placeholder="Password">

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button class="btn">Sign in</button>

        <div class="or">or continue with</div>

        <div class="social">
            <button>G</button>
            <button>Git</button>
            <button>f</button>
        </div>

        <div class="register">
            Don't have an account? <a href="#">Register for free</a>
        </div>
    </div>
</div>

</body>
</html>
